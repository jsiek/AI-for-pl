files."memcpy.c" = { preprocess = ["src/string/memcpy.c"], root = "libc/musl-1.2.6", includes = ["obj/shim", "arch/x86_64", "arch/generic", "obj/src/internal", "src/include", "src/internal", "obj/include", "include"] }
goals.body_memcpy = "semax_body Libc.spec_memcpy.Vprog Gprog Libc.memcpy.f_memcpy Libc.spec_memcpy.memcpy_spec"
extra = ["Goal VST.veric.initial_world.find_id Libc.memcpy._memcpy Gprog = Some (snd Libc.spec_memcpy.memcpy_spec). Proof. reflexivity. Qed."]

